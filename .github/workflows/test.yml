name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Unit tests
        run: python3 -B -m unittest discover -s tests -v
      - name: Backtest self-test
        run: python3 -B scripts/backtest.py --self-test
      - name: Syntax checks
        run: |
          python3 -m compileall -q scripts tests
          bash -n install.sh
